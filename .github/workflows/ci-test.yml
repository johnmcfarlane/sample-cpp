---
# tests of the checks required by CI, i.e. test tests
name: ci-test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'LICENCE'
      - 'README.md'
  workflow_dispatch:

jobs:
  tests:
    name: CI test
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/johnmcfarlane/sample-cpp:7
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: clang-asan
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "TRUE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: clang-debug
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "TRUE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: clang-fuzzer
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "TRUE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: clang-release
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "FALSE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "FALSE"
            trigger_warning: "FALSE"

          - profile: clang-tidy
            pm: conan
            trigger_clang_tidy_complexity: "TRUE"
            trigger_clang_tidy_goto: "TRUE"
            trigger_stdlib: "FALSE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "FALSE"
            trigger_warning: "TRUE"

          - profile: clang-tsan
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "FALSE"
            trigger_tsan: "TRUE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: gcc-asan
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "TRUE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: gcc-debug
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "TRUE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "TRUE"
            trigger_warning: "TRUE"

          - profile: gcc-release
            pm: conan
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "FALSE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "FALSE"
            trigger_warning: "FALSE"

          - profile: gcc-release
            pm: vcpkg
            trigger_clang_tidy_complexity: "FALSE"
            trigger_clang_tidy_goto: "FALSE"
            trigger_stdlib: "FALSE"
            trigger_tsan: "FALSE"
            trigger_ubsan: "FALSE"
            trigger_warning: "FALSE"

    env:
      TRIGGER_CLANG_TIDY_COMPLEXITY: ${{ matrix.trigger_clang_tidy_complexity }}
      TRIGGER_CLANG_TIDY_GOTO: ${{ matrix.trigger_clang_tidy_goto }}
      TRIGGER_STDLIB: ${{ matrix.trigger_stdlib }}
      TRIGGER_TSAN: ${{ matrix.trigger_tsan }}
      TRIGGER_UBSAN: ${{ matrix.trigger_ubsan }}
      TRIGGER_WARNING: ${{ matrix.trigger_warning }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # - name: Cache build artefacts
      #   uses: actions/cache@v6
      #   with:
      #     key: ${{ matrix.profile }}-${{ hashFiles(
      #       '.devcontainer/**',
      #       '.github/workflows/ci-test.yml',
      #       'conanfile.*',
      #       'scripts/${{ matrix.pm }}/install',
      #       'scripts/${{ matrix.pm }}/config/${{ matrix.profile }}',
      #       'vcpkg-configuration.json',
      #       'vcpkg.json') }}
      #     path: |
      #       ~/.conan2/p
      #       ~/.cache/vcpkg/archives

      - name: Build
        run: scripts/${{ matrix.pm }}/install ${{ matrix.profile }}

      - name: Test
        run: scripts/${{ matrix.pm }}/build ${{ matrix.profile }} .github/workflows/ci-test
